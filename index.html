<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Quai Antique — Restaurant gastronomique au bord de l'eau. Cuisine raffinée et produits de saison." />
  <title>Quai Antique — Accueil</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" href="images/logo-icon.svg" type="image/svg+xml" />
</head>
<body>
  <a class="skip-link" href="#contenu">Aller au contenu principal</a>

  <header class="site-header">
    <nav class="navbar navbar-expand-lg" aria-label="Navigation principale">
      <div class="header-inner">
        <a class="logo" href="#/" data-route="/">
          <img src="images/logo-icon.svg" alt="" class="logo-mark" width="48" height="48" />
          <span class="logo-text">
            Quai Antique
            <span>Restaurant</span>
          </span>
        </a>

        <div class="header-end">
          <div class="header-nav d-none d-lg-flex">
            <ul class="navbar-nav nav-main">
              <li class="nav-item"><a class="nav-link" href="#/" data-route="/">Accueil</a></li>
              <li class="nav-item"><a class="nav-link" href="#/carte" data-route="/carte">La Carte</a></li>
              <li class="nav-item"><a class="nav-link" href="#/contact" data-route="/contact">Contact</a></li>
            </ul>
            <a class="btn btn-primary" href="#/contact" data-route="/contact">Réserver</a>
          </div>

          <button
            class="navbar-toggler d-lg-none"
            type="button"
            data-bs-toggle="offcanvas"
            data-bs-target="#menuLateral"
            aria-controls="menuLateral"
            aria-label="Ouvrir le menu"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
        </div>
      </div>
    </nav>

    <div class="offcanvas offcanvas-start menu-lateral" tabindex="-1" id="menuLateral" aria-labelledby="menuLateralLabel">
      <div class="offcanvas-header">
        <h2 class="offcanvas-title" id="menuLateralLabel">Navigation</h2>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Fermer le menu"></button>
      </div>
      <div class="offcanvas-body">
        <nav class="nav flex-column menu-lateral-nav" aria-label="Menu mobile">
          <a class="nav-link" href="#/" data-route="/">Accueil</a>
          <a class="nav-link" href="#/carte" data-route="/carte">La Carte</a>
          <a class="nav-link" href="#/contact" data-route="/contact">Contact</a>
          <a class="nav-link" href="#/contact" data-route="/contact">Réserver une table</a>
        </nav>
      </div>
    </div>
  </header>

  <main id="contenu" tabindex="-1"></main>

  <footer class="site-footer" id="site-footer">
    <div id="footer-content"></div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="js/menu.js?v=2"></script>
  <script src="js/router.js?v=2"></script>
</body>
</html>
